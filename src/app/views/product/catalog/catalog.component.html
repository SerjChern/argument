<div class="catalog">
  <div class="container">
    <div class="nav-back" routerLink="/">
      <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 30 30" fill="none">
        <path d="M5.47588 14.5699C5.18971 14.859 5.19247 15.3257 5.48204 15.6123L10.2009 20.2826C10.4904 20.5691 10.9572 20.5671 11.2433 20.2779C11.5295 19.9888 11.5267 19.5221 11.2372 19.2355L7.04266 15.0842L11.1879 10.8958C11.474 10.6067 11.4713 10.1399 11.1817 9.85335C10.8922 9.56677 10.4254 9.56884 10.1393 9.85798L5.47588 14.5699ZM26 15L25.9956 14.2629L5.99584 14.3517L6.0002 15.0888L6.00455 15.8259L26.0044 15.7371L26 15Z" fill="#A69F9F"/>
      </svg>
      <span>На главную</span>
    </div>
    <div class="catalog-title">Каталог</div>
    <div class="catalog-head">
      <div class="catalog-applied-filters">
        <div class="catalog-applied-filter" *ngFor="let filteredCategory of filteredCategories">
          <span>{{ filteredCategory }}</span>
          <a (click)="removeFilters(filteredCategory)">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="15" viewBox="0 0 14 15" fill="none">
              <line x1="0.935622" y1="1.1499" x2="12.9564" y2="13.1707" stroke="#A8ABA7" stroke-linecap="round"/>
              <line x1="12.9238" y1="1.12996" x2="0.903013" y2="13.1508" stroke="#A8ABA7" stroke-linecap="round"/>
            </svg>
          </a>
        </div>
          <div class="delete-all catalog-applied-filter" *ngIf="filtersActive" (click)="clearAllFilters()">
              Удалить все фильтры
          </div>
      </div>
      <div class="catalog-sorting" [class.open]="sortingOpen" (click)="sortingToggle()">
          <div class="catalog-sorting-head">
              <span>Сортировать</span>
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="8" viewBox="0 0 16 8" fill="none">
                <path d="M8.00026 7.50003C7.41693 7.50003 6.83359 7.27503 6.39193 6.83337L0.958594 1.40003C0.716927 1.15837 0.716927 0.758366 0.958594 0.516699C1.20026 0.275033 1.60026 0.275033 1.84193 0.516699L7.27526 5.95003C7.67526 6.35003 8.32526 6.35003 8.72526 5.95003L14.1586 0.516699C14.4003 0.275033 14.8003 0.275033 15.0419 0.516699C15.2836 0.758366 15.2836 1.15837 15.0419 1.40003L9.60859 6.83337C9.16693 7.27503 8.58359 7.50003 8.00026 7.50003Z" fill="#2C2C2C"/>
              </svg>
          </div>
          <div class="catalog-sorting-body">
              <div class="catalog-sorting-item"
                   [class.active]="this.activeParams.sort ? this.activeParams.sort === sortingOption.value : false"
                   (click)="sort(sortingOption.value)"
                   *ngFor="let sortingOption of sortingOptions">{{sortingOption.name}}
              </div>

          </div>
      </div>
    </div>

    <div class="catalog-layout">
      <div class="catalog-filters">
        <category-filter [category]="category" *ngFor="let category of categories"></category-filter>
      </div>

      <div class="catalog-products">
        <product-card *ngFor="let product of paginatedProducts" [Product]="product"></product-card>
      </div>
    </div>
      <div class="pagination" *ngIf="pages.length > 1">
          <div class="pagination-arrow"
               (click)="openPrevPage()"
               [class.disabled]="+activeParams.page === 1">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="25" viewBox="0 0 24 25" fill="none">
                  <path d="M9.56988 5.98092C9.75988 5.98092 9.94988 6.04973 10.0999 6.19717C10.3899 6.48223 10.3899 6.95405 10.0999 7.2391L4.55988 12.6847L10.0999 18.1303C10.3899 18.4153 10.3899 18.8871 10.0999 19.1722C9.80988 19.4573 9.32988 19.4573 9.03988 19.1722L2.96988 13.2056C2.67988 12.9206 2.67988 12.4488 2.96988 12.1637L9.03988 6.19717C9.18988 6.04973 9.37988 5.98092 9.56988 5.98092Z" fill="#2C2C2C"/>
                  <path d="M3.67 11.9474L20.5 11.9474C20.91 11.9474 21.25 12.2816 21.25 12.6847C21.25 13.0877 20.91 13.4219 20.5 13.4219L3.67 13.4219C3.26 13.4219 2.92 13.0877 2.92 12.6847C2.92 12.2816 3.26 11.9474 3.67 11.9474Z" fill="#2C2C2C"/>
              </svg>
          </div>

          <div class="pagination-pages">
              <a class="pagination-page"
                 (click)="openPage(page)"
                 [class.active]="activeParams.page == page"
              *ngFor="let page of pages">{{page}}</a>
          </div>

          <div class="pagination-arrow"
               (click)="openNextPage()"
               [class.disabled]="+activeParams.page === pages.length">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="25" viewBox="0 0 24 25" fill="none">
                  <path d="M14.4301 19.3885C14.2401 19.3885 14.0501 19.3197 13.9001 19.1722C13.6101 18.8872 13.6101 18.4153 13.9001 18.1303L19.4401 12.6847L13.9001 7.23913C13.6101 6.95407 13.6101 6.48225 13.9001 6.19719C14.1901 5.91213 14.6701 5.91213 14.9601 6.19719L21.0301 12.1637C21.3201 12.4488 21.3201 12.9206 21.0301 13.2057L14.9601 19.1722C14.8101 19.3197 14.6201 19.3885 14.4301 19.3885Z" fill="#2C2C2C"/>
                  <path d="M20.33 13.4219H3.5C3.09 13.4219 2.75 13.0877 2.75 12.6847C2.75 12.2817 3.09 11.9475 3.5 11.9475H20.33C20.74 11.9475 21.08 12.2817 21.08 12.6847C21.08 13.0877 20.74 13.4219 20.33 13.4219Z" fill="#2C2C2C"/>
              </svg>
          </div>
      </div>
  </div>
</div>
<!-- comment-->
