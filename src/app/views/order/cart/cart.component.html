<div class="cart">
  <div class="container">
    <div class="nav-back" routerLink="/catalog">
      <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 30 30" fill="none">
        <path d="M5.47588 14.5699C5.18971 14.859 5.19247 15.3257 5.48204 15.6123L10.2009 20.2826C10.4904 20.5691 10.9572 20.5671 11.2433 20.2779C11.5295 19.9888 11.5267 19.5221 11.2372 19.2355L7.04266 15.0842L11.1879 10.8958C11.474 10.6067 11.4713 10.1399 11.1817 9.85335C10.8922 9.56677 10.4254 9.56884 10.1393 9.85798L5.47588 14.5699ZM26 15L25.9956 14.2629L5.99584 14.3517L6.0002 15.0888L6.00455 15.8259L26.0044 15.7371L26 15Z" fill="#A69F9F"/>
      </svg>
      <span>В каталог</span>
    </div>
    <div class="cart-title">корзина покупок</div>
    <div class="cart-info">
      <div class="cart-empty" *ngIf="cartIsEmpty">
        <div class="cart-empty-description">
          Корзина пуста, вы можете вернуться в каталог или на главную страницу
        </div>
        <div class="cart-empty-actions">
          <button class="order-button" routerLink="/">На главную</button>
          <button class="order-button" routerLink="/catalog">В каталог</button>
        </div>
      </div>
      <div class="cart-products">
        <div class="cart-product" *ngFor="let item of cartItems; let i = index">
          <div class="cart-product-image" style="background-image: url({{item.image}})"></div>
          <div class="cart-product-info">
            <div class="cart-product-info-name">{{item.name}}</div>
            <div class="cart-product-info-extra">
              <div class="cart-product-info-extra-size" *ngIf="item.size">
                <span>Размер:</span>
                <div class="cart-product-info-extra-size-size">{{item.size}}</div>
              </div>
              <div class="cart-product-info-extra-color" *ngIf="item.color">
                <span>Цвет:</span>
                <div class="cart-product-info-extra-color-color">{{item.color}}</div>
              </div>
            </div>
          </div>
          <count-selector [count]="item.quantity"
                          (onCountChange)="updateCount(i, $event)"></count-selector>
          <div class="cart-product-price">{{ item.price * item.quantity }} руб</div>
          <div class="cart-product-remove" (click)="removeItem(i)">
            <svg xmlns="http://www.w3.org/2000/svg" width="40" height="41" viewBox="0 0 40 41" fill="none">
              <path d="M19.9996 3.83331C17.076 3.83331 14.6416 6.01784 14.233 8.83331H8.53148C8.46051 8.82117 8.38863 8.81518 8.31663 8.81541C8.25442 8.81675 8.1924 8.82274 8.13108 8.83331H5.41624C5.2506 8.83097 5.08615 8.86157 4.93244 8.92334C4.77873 8.98511 4.63883 9.07681 4.52086 9.19311C4.4029 9.30942 4.30923 9.44801 4.2453 9.60083C4.18136 9.75365 4.14844 9.91766 4.14844 10.0833C4.14844 10.249 4.18136 10.413 4.2453 10.5658C4.30923 10.7186 4.4029 10.8572 4.52086 10.9735C4.63883 11.0898 4.77873 11.1815 4.93244 11.2433C5.08615 11.3051 5.2506 11.3357 5.41624 11.3333H7.19847L9.29645 33.0244C9.52235 35.3633 11.5094 37.1666 13.8586 37.1666H26.1389C28.4882 37.1666 30.4753 35.3635 30.7011 33.0244L32.8007 11.3333H34.5829C34.7485 11.3357 34.913 11.3051 35.0667 11.2433C35.2204 11.1815 35.3603 11.0898 35.4783 10.9735C35.5962 10.8572 35.6899 10.7186 35.7538 10.5658C35.8178 10.413 35.8507 10.249 35.8507 10.0833C35.8507 9.91766 35.8178 9.75365 35.7538 9.60083C35.6899 9.44801 35.5962 9.30942 35.4783 9.19311C35.3603 9.07681 35.2204 8.98511 35.0667 8.92334C34.913 8.86157 34.7485 8.83097 34.5829 8.83331H31.8697C31.7371 8.8118 31.6019 8.8118 31.4693 8.83331H25.7662C25.3576 6.01784 22.9232 3.83331 19.9996 3.83331ZM19.9996 6.33331C21.5655 6.33331 22.8502 7.39011 23.2173 8.83331H16.7818C17.1489 7.39011 18.4336 6.33331 19.9996 6.33331ZM9.70823 11.3333H30.2893L28.2125 32.7835C28.1083 33.8628 27.2229 34.6666 26.1389 34.6666H13.8586C12.7762 34.6666 11.8892 33.8613 11.7851 32.7835L9.70823 11.3333ZM17.0634 15.4821C16.7321 15.4873 16.4165 15.6237 16.1858 15.8614C15.9551 16.0992 15.8282 16.4187 15.8329 16.75V29.25C15.8306 29.4156 15.8612 29.5801 15.9229 29.7338C15.9847 29.8875 16.0764 30.0274 16.1927 30.1454C16.309 30.2633 16.4476 30.357 16.6004 30.4209C16.7532 30.4849 16.9173 30.5178 17.0829 30.5178C17.2486 30.5178 17.4126 30.4849 17.5654 30.4209C17.7182 30.357 17.8568 30.2633 17.9731 30.1454C18.0894 30.0274 18.1811 29.8875 18.2429 29.7338C18.3046 29.5801 18.3352 29.4156 18.3329 29.25V16.75C18.3353 16.5827 18.3041 16.4166 18.2411 16.2616C18.1782 16.1065 18.0847 15.9657 17.9663 15.8475C17.8479 15.7293 17.707 15.636 17.5519 15.5732C17.3968 15.5105 17.2307 15.4795 17.0634 15.4821ZM22.8967 15.4821C22.5655 15.4873 22.2498 15.6237 22.0191 15.8614C21.7884 16.0992 21.6615 16.4187 21.6662 16.75V29.25C21.6639 29.4156 21.6945 29.5801 21.7563 29.7338C21.818 29.8875 21.9097 30.0274 22.026 30.1454C22.1423 30.2633 22.2809 30.357 22.4338 30.4209C22.5866 30.4849 22.7506 30.5178 22.9162 30.5178C23.0819 30.5178 23.2459 30.4849 23.3987 30.4209C23.5515 30.357 23.6901 30.2633 23.8064 30.1454C23.9227 30.0274 24.0144 29.8875 24.0762 29.7338C24.138 29.5801 24.1686 29.4156 24.1662 29.25V16.75C24.1686 16.5827 24.1374 16.4166 24.0745 16.2616C24.0115 16.1065 23.918 15.9657 23.7996 15.8475C23.6813 15.7293 23.5403 15.636 23.3852 15.5732C23.2301 15.5105 23.064 15.4795 22.8967 15.4821Z" fill="#585450"/>
            </svg>
          </div>
        </div>

      </div>
      <div class="cart-actions" *ngIf="!cartIsEmpty">
        <div class="summary">
          <span>Итого:</span>
          <div class="total-price">
            {{price}} руб
          </div>
        </div>
        <button class="order-button" routerLink="/order">Оформить заказ</button>
      </div>
    </div>
  </div>
</div>
